name: CI

# Ne yapar: statik kapılar (lint + tarayıcısız test + hedef/kimlik doğrulama + doküman drift)
# ve ardından gerçek tarayıcıyla uçtan uca koşu (yerel mock offerwall + yerel SMTP/IMAP).
#
# Neyi YAPMAZ: üçüncü taraf hedeflere istek atmaz. E2E yalnızca bu repodaki sandbox'a koşar;
# qa-kit/offerwall/run_offerwall.py kapsam kapısı burada da zorunludur (authorized_hosts.txt).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      contexts:
        description: "İzole tarayıcı bağlamı sayısı (E2E)"
        required: false
        default: "10"
      concurrency:
        description: "Aynı anda çalışan bağlam sayısı (E2E)"
        required: false
        default: "5"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_PROGRESS_BAR: "off"

jobs:
  gates:
    name: Statik kapılar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff pytest

      - name: ruff (F, E9)
        run: ruff check waft/ qa-kit/ examples/ tests/ --select F,E9 --ignore E501

      - name: pytest — tarayıcısız katman
        run: python -m pytest -q -m "not integration"

      - name: Hedef sayfası doğrulaması (kapsam + bilinen tuzaklar)
        run: python qa-kit/offerwall/validate_targets.py --targets qa-kit/offerwall/targets_offerwall.xlsx

      - name: Kimlik şablonu doğrulaması
        run: >-
          python qa-kit/offerwall/import_credentials.py
          --in qa-kit/offerwall/credentials.example.json
          --check --allow-placeholders --min-accounts 10

      - name: Yük testi kiti doğrulaması (tarayıcısız, --check)
        run: python qa-kit/loadtest/run_load_test.py --sandbox --check

      - name: DELIVERY.md ↔ kaynaklar drift kapısı
        run: python qa-kit/offerwall/build_delivery.py --check

  e2e:
    name: Uçtan uca (tarayıcı + SMTP/IMAP)
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTEXTS: ${{ github.event.inputs.contexts || '10' }}
      CONCURRENCY: ${{ github.event.inputs.concurrency || '5' }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Playwright tarayıcı önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Bağımlılıklar + Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m playwright install --with-deps chromium

      - name: pytest — entegrasyon dahil (gerçek Chromium)
        run: python -m pytest -q

      - name: Uçtan uca koşu (sandbox + devmail, kapsam kapısı açık)
        run: bash qa-kit/offerwall/sandbox_up.sh --keep --no-color

      - name: Yük testi kiti (10 bağlam, yerel sandbox, CAPTCHA skip politikası)
        run: >-
          python qa-kit/loadtest/run_load_test.py --sandbox
          --contexts 10 --concurrency 5 --no-screenshots --no-color

      - name: Koşu özeti (job summary)
        if: always()
        run: python .github/scripts/ci_summary.py

      - name: Artefaktlar (HAR, ekran görüntüleri, trace, junit, endpoints)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waft-e2e-artifacts
          path: |
            artifacts/
            qa-kit/offerwall/selectors.resolved.report.json
          if-no-files-found: warn
          retention-days: 14
